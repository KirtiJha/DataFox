<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="foxGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF4500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fox Head - Main Body -->
  <path d="M32 8 L22 16 L12 24 L12 36 L16 44 L24 48 L32 52 L40 48 L48 44 L52 36 L52 24 L42 16 L32 8 Z" 
        fill="url(#foxGradient)" 
        stroke="none"/>
  
  <!-- Fox Ears -->
  <path d="M22 16 L18 8 L26 12 L22 16 Z" fill="url(#foxGradient)"/>
  <path d="M42 16 L46 8 L38 12 L42 16 Z" fill="url(#foxGradient)"/>
  
  <!-- Inner Ears -->
  <path d="M22 14 L20 10 L24 12 L22 14 Z" fill="url(#accentGradient)"/>
  <path d="M42 14 L44 10 L40 12 L42 14 Z" fill="url(#accentGradient)"/>
  
  <!-- Eyes -->
  <circle cx="26" cy="28" r="3" fill="white"/>
  <circle cx="38" cy="28" r="3" fill="white"/>
  <circle cx="26" cy="27" r="1.5" fill="#1F2937"/>
  <circle cx="38" cy="27" r="1.5" fill="#1F2937"/>
  
  <!-- Snout -->
  <path d="M32 32 L28 36 L32 40 L36 36 L32 32 Z" fill="url(#foxGradient)" opacity="0.8"/>
  
  <!-- Nose -->
  <ellipse cx="32" cy="36" rx="2" ry="1.5" fill="#1F2937"/>
</svg>
